services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: certs
      POSTGRES_PASSWORD: certs
      POSTGRES_DB: certs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certs -d certs"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://certs:certs@db:5432/certs
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - certificates:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://certs:certs@db:5432/certs
      STORAGE_DIR: /app/storage
    volumes:
      - certificates:/app/storage
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  certificates:
