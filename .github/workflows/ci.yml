name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
    test:
        runs-on: ubuntu-24.04

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: certs
                    POSTGRES_PASSWORD: certs
                    POSTGRES_DB: certs
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U certs -d certs"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        
        env:
            TEST_DATABASE_URL: postgresql+psycopg://certs:certs@localhost:5432/certs_test

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: "pip"
                  cache-dependency-path: requirements*.txt

            - name: Install WeasyPrint System libraries
              run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
              
            - name: Install Python dependencies
              run: pip install -r requirements-dev.txt

            - name: Lint
              run: |
                ruff check app tests
                ruff format --check app tests

            - name: Test
              run: pytest --cov=app --cov-report=term-missing
